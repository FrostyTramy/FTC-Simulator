# DC motor models, SDK motor types and the REV hub motor controller (spec 04 "DC motor model",
# spec 06 "Motors"). Read by sim/Sim.Hardware (HardwareConfig) and validated by
# config/schemas/motors.schema.json (tests/python/test_hardware_configs.py).
# Every number is a quantity {value, unit, source}; ASSUMED = not from a datasheet, calibrate in Phase 11.
#
# Model (sim/Sim.Hardware/DcMotor.cs): constants are derived at the OUTPUT shaft from the datasheet
# free speed / free current / stall torque / stall current at the nominal voltage, so the
# gearbox efficiency is implicit in the datasheet stall torque:
#   R = V/I_stall, Kt = T_stall/I_stall, Ke = (V - I_free*R)/w_free, T_friction = Kt*I_free

