# REV Control Hub / Expansion Hub motor controller (firmware behaviour, emulated by
# sim/Sim.Hardware/HubMotorController.cs). SDK-side facts come from the SDK 12.0.0 bytecode of
# LynxDcMotorController.internalSetMotorPower: RUN_WITHOUT_ENCODER sends a constant power
# (power scaled to +-32767), RUN_USING_ENCODER and RUN_TO_POSITION send a target velocity
# = signum(power) * |power| * achievableMaxTicksPerSecondRounded (int truncation).
hub_motor_controller:
  ports_per_hub: {value: 4, unit: count, source: "SDK 12.0.0 LynxConstants.NUMBER_OF_MOTORS (javadoc constant-values)"}
  power_full_scale: {value: 32767, unit: counts, source: "SDK 12.0.0 LynxDcMotorController (Range.scale to -32767..32767)"}
  default_target_position_tolerance: {value: 5, unit: counts, source: "SDK LynxConstants.DEFAULT_TARGET_POSITION_TOLERANCE = 5 (javadoc constant-values)"}
  default_velocity_pidf: {value: [10.0, 3.0, 0.0, 0.0], unit: pidf, source: "SDK 12.0.0 RevRoboticsCoreHexMotor @ExpansionHubMotorControllerVelocityParams P=10 I=3 D=0; used as the firmware default for types without params (ASSUMED for goBILDA)"}
  default_position_pidf: {value: [10.0, 0.05, 0.0, 0.0], unit: pidf, source: "SDK 12.0.0 RevRoboticsCoreHexMotor @ExpansionHubMotorControllerPositionParams P=10 I=0.05 D=0; ASSUMED firmware default for goBILDA"}
