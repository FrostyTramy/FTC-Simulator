# BIOBUZZ rule numbers for the simulator. Human-readable version: docs/game_rules.md.
# Every number is a quantity {value, unit, source}. source = manual section/page, figure, table or
# rule; "SIM" marks our own interpretation (listed in docs/game_rules.md §13), "ASSUMED" a guess.
# Validated by config/schemas/rules_biobuzz.schema.json (tests/python/test_rules_config.py).

manual: {document: BIOBUZZ_Competition_Manual_TU06.pdf, version: TU06, date: "2026-10-22"}

field:
  size: {value: 144, unit: in, source: "§9.2 p64"}
  cad_tolerance: {value: 1, unit: in, source: "§9.1 p63"}
  tile_size: {value: 24, unit: in, source: "§9.2 p64"}
  tile_thickness: {value: 0.59, unit: in, source: "§9.2 p64"}
  tile_count: {value: 36, unit: count, source: "§9.2 p64"}
  tile_columns: {value: [A, B, C, D, E, F], unit: label, source: "Fig 9-5 p67"}
  tile_rows: {value: [1, 2, 3, 4, 5, 6], unit: label, source: "Fig 9-5 p67"}
  red_side_columns: {value: [A, B, C], unit: label, source: "G304.A p104"}
  blue_side_columns: {value: [D, E, F], unit: label, source: "G304.A p104"}
  tape_width: {value: 1, unit: in, source: "§9.3 p65 (1 or 2 in; field CAD uses 1 in)"}

zones:
  alliance_area: {value: [97, 54], unit: in, source: "§9.3 p65 (width, depth)"}
  loading_zone: {value: [23, 11], unit: in, source: "§9.3 p65 (width, depth)"}
  loading_zone_tile: {value: {red: A5, blue: F2}, unit: label, source: "Fig 9-2 p65, Fig 9-5 p67"}
  garden: {value: [23, 2], unit: in, source: "§9.3 p66 (length, width)"}
  garden_tile: {value: {red: A1, blue: F6}, unit: label, source: "Fig 9-2 p65, Fig 9-5 p67"}

hive:
