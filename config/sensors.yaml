# Sensor models (spec 09). Read by sim/Sim.Sensors (SensorModels); validated by
# config/schemas/sensors.schema.json. Every number is a quantity {value, unit, source}; ASSUMED =
# not published, to be measured on real hardware (Phase 11 calibration).
#
# Evidence ids used in `source` strings:
#   SDK    = FTC SDK 12.0.0 AARs in generated/sdk/12.0.0 (javap: signatures and constants only)
#   GBDRV  = goBILDA open-source Pinpoint driver (MIT), generated/sdk/vendor/GoBildaPinpointDriver_v1.java
#   CALIB  = SDK 12.0.0 RobotCore res/xml/builtinwebcamcalibrations.xml

version: 1

pinpoint:
  gobilda_pinpoint:
    part: {value: "goBILDA 3110-0002-0001 Pinpoint Odometry Computer", unit: label, source: "SDK sample SensorGoBildaPinpoint (product link)"}
    loop_time: {value: 666, unit: us, source: "goBILDA product page: 1500 position updates per second → 1/1500 s; integer µs register ASSUMED"}
    device_id: {value: 1, unit: id, source: "ASSUMED (GBDRV reads register DEVICE_ID, value not published)"}
    device_version: {value: 1, unit: version, source: "ASSUMED"}
    calibration_time: {value: 0.25, unit: s, source: "GBDRV javadoc of recalibrateIMU/resetPosAndIMU: about 0.25 s"}
    power_on_ticks_per_mm: {value: 19.89436789, unit: ticks/mm, source: "ASSUMED power-on resolution = goBILDA_4_BAR_POD (GBDRV constant)"}
    power_on_yaw_scalar: {value: 1.0, unit: ratio, source: "ASSUMED (the per-device tuned value is not published)"}
    gyro_noise_density: {value: 0.0028, unit: deg/s/sqrt(Hz), source: "ASSUMED: MEMS gyro class figure (2.8 mdps/√Hz)"}
    gyro_bias_residual: {value: 0.003, unit: deg/s, source: "ASSUMED residual yaw-rate bias after calibration (1 sigma)"}
    velocity_filter: {value: 20, unit: ms, source: "ASSUMED low-pass time constant of the reported velocities"}

odometry_pods:
  goBILDA_SWINGARM_POD:
    ticks_per_mm: {value: 13.26291192, unit: ticks/mm, source: "GBDRV constant goBILDA_SWINGARM_POD"}
  goBILDA_4_BAR_POD:
    ticks_per_mm: {value: 19.89436789, unit: ticks/mm, source: "GBDRV constant goBILDA_4_BAR_POD"}
  lift_tilt: {value: 8.0, unit: deg, source: "ASSUMED: spring-loaded pods lose the floor beyond about 8° of chassis tilt"}

otos:
  sparkfun_otos:
    part: {value: "SparkFun Optical Tracking Odometry Sensor (PAA5160E1 + LSM6DSO)", unit: label, source: "SDK sample SensorSparkFunOTOS"}
    product_id: {value: 95, unit: id, source: "SDK SparkFunOTOS.PRODUCT_ID = 0x5F"}
    hw_version: {value: 16, unit: "byte (major 1, minor 0)", source: "ASSUMED"}
    fw_version: {value: 16, unit: "byte (major 1, minor 0)", source: "ASSUMED"}
    imu_calibration_sample_time: {value: 2.4, unit: ms, source: "SparkFun OTOS library javadoc of calibrateImu: each sample takes about 2.4 ms"}
    power_on_calibration_samples: {value: 255, unit: samples, source: "ASSUMED: the sensor calibrates its IMU at power-on like calibrateImu()"}
    max_speed: {value: 2.5, unit: m/s, source: "SparkFun OTOS product page: tracks up to 2.5 m/s"}
    max_tilt: {value: 5.0, unit: deg, source: "ASSUMED: optical tracking is lost (warnTiltAngle) beyond 5° of sensor tilt"}
    linear_error: {value: 0.0, unit: ratio, source: "ASSUMED (true scale = 1 + error; calibrate per robot in Phase 11)"}
    angular_error: {value: 0.0, unit: ratio, source: "ASSUMED"}
    gyro_noise_density: {value: 0.0038, unit: deg/s/sqrt(Hz), source: "ASSUMED: LSM6DSO rate noise density class figure 3.8 mdps/√Hz"}
    position_noise: {value: 0.0002, unit: m, source: "ASSUMED white noise per reading"}

color:
  rev_color_v3:
    part: {value: "REV Color Sensor V3 (Broadcom APDS-9151)", unit: label, source: "SDK RevColorSensorV3 extends BroadcomColorSensorImpl"}
    device_id: {value: 194, unit: id, source: "ASSUMED: APDS-9151 PART_ID 0xC2"}
    max_distance: {value: 0.06, unit: m, source: "ASSUMED: getDistance saturates at about 6 cm (REV documents usable range of a few cm)"}
    cone_half_angle: {value: 15, unit: deg, source: "ASSUMED"}
    full_scale_counts: {value: 65535, unit: counts, source: "ASSUMED 16-bit colour channel scale at the SDK default gain"}
    white_target_counts: {value: 2000, unit: counts, source: "ASSUMED raw alpha of a white surface at 1 cm, gain 1"}
    ambient_counts: {value: 40, unit: counts, source: "ASSUMED raw counts with nothing in range"}
    noise: {value: 0.01, unit: ratio, source: "ASSUMED relative noise per channel"}

distance:
  rev_2m:
    part: {value: "REV 2m Distance Sensor (ST VL53L0X)", unit: label, source: "SDK Rev2mDistanceSensor extends VL53L0X"}
    model_id: {value: 238, unit: id, source: "ST VL53L0X datasheet: model id register 0xC0 = 0xEE"}
    min_range: {value: 0.03, unit: m, source: "ASSUMED (VL53L0X minimum range a few cm)"}
    max_range: {value: 2.0, unit: m, source: "REV 2m Distance Sensor product page: up to 2 m"}
    out_of_range_mm: {value: 8190, unit: mm, source: "ASSUMED: VL53L0X out-of-range code reported as 8190 mm"}
    cone_half_angle: {value: 12.5, unit: deg, source: "ST VL53L0X datasheet: 25° field of view"}
    noise: {value: 0.03, unit: ratio, source: "ASSUMED ranging error (1 sigma) ~3% of distance"}
    update_period: {value: 33, unit: ms, source: "ST VL53L0X default timing budget 33 ms"}

touch:
  rev_touch:
    part: {value: "REV Touch Sensor (REV-31-1425)", unit: label, source: "SDK sample SensorDigitalTouch"}
    travel: {value: 0.003, unit: m, source: "ASSUMED: pressed when an object is within 3 mm of the button face"}

webcam:
  logitech_c920:
    part: {value: "Logitech HD Pro Webcam C920 (vid Logitech, pid 0x082D)", unit: label, source: "CALIB"}
    resolution: {value: [640, 480], unit: px, source: "SDK VisionPortal default 640x480 (CALIB header)"}
    focal_length: {value: [622.001, 622.001], unit: px, source: "CALIB C920 640x480"}
    principal_point: {value: [319.803, 241.251], unit: px, source: "CALIB C920 640x480"}
    distortion: {value: [0.1208, -0.261599, 0, 0, 0.10308, 0, 0, 0], unit: "k1 k2 p1 p2 k3 k4 k5 k6", source: "CALIB C920 640x480 (not rendered yet: pinhole camera)"}
    fps: {value: 30, unit: Hz, source: "ASSUMED: 30 fps at 640x480"}
    latency: {value: 60, unit: ms, source: "ASSUMED: capture to processor (USB transfer + decoding)"}
