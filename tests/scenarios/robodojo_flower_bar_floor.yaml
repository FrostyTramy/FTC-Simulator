# RoboDojo #23205 flower bar (USER 2026-10-26): swung DOWN it is as low as possible, touching the floor a little, and
# must not collide: the arm stops where its lowest point is 2 mm into the tiles (floor_stop) and the robot is not
# lifted or tilted by it. The TeleOp commands DOWN = 1.0, past the floor.
name: robodojo_flower_bar_floor
layout: field
duration_s: 2.5
actions:
  - action: robot
    at_s: 0
    name: robodojo_23205
    position: [-1.3, 0.0, 1.05]
    yaw_deg: -90
    drive:
      - {at_s: 0.1, servo: {flower_bar: 1.0, hood: 0.0}}
checks:
  - {check: arm_lowest_point, group: yellow_bar, min_m: -0.0025, max_m: -0.0015}
  - {check: robot_position, min: [-1.31, -0.004, 1.04], max: [-1.29, 0.002, 1.06]}
  - {check: robot_upright, max_tilt_deg: 0.5}
