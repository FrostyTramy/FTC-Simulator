# Loader self-test on the synthetic layout (godot/test_assets/synthetic). A ball is dropped on a ramp
# whose surface falls towards +X; it must roll off on the +X side. Fails if row-major matrices are
# read transposed (ramp would fall towards -X, ball would start at the origin).
name: loader_transforms
layout: synthetic
duration_s: 1.5
checks:
  - {check: element_count, equals: 1}
  - {check: element_in_box, group: pollen, index: 0, min: [0.45, -0.1, -0.5], max: [4.0, 0.3, 0.5]}
  - {check: body_rotation, body: block, axis: [0, 1, 0], min_deg: -0.01, max_deg: 0.01}
