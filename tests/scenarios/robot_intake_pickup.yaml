# Phase 5 mechanisms: with the intake running (example TeleOp mapping: Gecko roller + corner sweepers), the StarterBot
# drives slowly onto a POLLEN lying in front of it. The roller draws it in and the guided path (D-027) takes it into
# the hopper: it must end up in a hopper slot (y 0.08 m, between the front bar and the hood).
name: robot_intake_pickup
layout: field
duration_s: 3.0
actions:
  - {action: robot, at_s: 0, name: gobilda_starter, position: [-1.3, 0.0, 1.05], yaw_deg: -90,
     drive: [{at_s: 0.25, intake: 1}, {at_s: 0.5, forward: 0.3}, {at_s: 1.6, forward: 0}]}
  - {action: spawn, at_s: 0.05, group: pollen, count: 1, relative_to: robot, center: [0.0, 0.0376, -0.33]}
trace: {group: pollen, index: -1, every_s: 0.1}
checks:
  - {check: element_in_robot, group: pollen, index: -1, min: [-0.1, 0.06, -0.1], max: [0.1, 0.12, 0.05]}
  - {check: robot_upright, max_tilt_deg: 3.0}
