# Physical ball path (D-037): a pre-loaded NECTAR moves only where the robot's rollers and colliders take it. On the
# stand-in robot nothing reaches from the channel floor up to the turret, so with the transfer running, the gate open
# and the shooter at speed the element stays stuck in the robot instead of being launched (the guided path would feed
# and launch it by rule, robodojo_nectar_forward). On the real CAD the same physics decides whether it jams.
name: robodojo_physical_stuck
layout: field
duration_s: 3.0
actions:
  - action: robot
    at_s: 0
    name: robodojo_23205
    position: [-1.3, 0.0, 1.05]
    yaw_deg: -90
    drive:
      - {at_s: 0.1, velocity: {shooter: 1800}, servo: {gate: 0.5, hood: 0.5, flower_bar: 0.25}}
      - {at_s: 1.0, servo: {gate: 0.8}, power: {transfer: 1}}
  - {action: preload, at_s: 0.1, group: nectar_red, count: 1}
trace: {group: nectar_red, index: -1, every_s: 0.25}
checks:
  - {check: element_peak_height, group: nectar_red, index: -1, max_m: 0.4}
  - {check: robot_holds, min: 1, max: 1}
  - {check: robot_upright, max_tilt_deg: 3.0}
