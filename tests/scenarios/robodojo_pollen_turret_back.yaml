# RoboDojo #23205 turret robot, POLLEN: taken in by the running intake (guided path, D-027); the turret is driven
# into its +180 deg hard stop (it now faces backward); the shooter spins up to 1800 ticks/s, the gate opens and the
# transfer feeds. The POLLEN (71 mm) pushes the sprung hood insert back 19 mm, inside its 20 mm travel, so only the
# spring presses it: it slips on the Geckos and leaves at about 5.5 m/s instead of half the rim speed (7.7 m/s).
# It must fly about 1.8 m high (hood at 0.5: 78 deg) and land BEHIND the robot.
name: robodojo_pollen_turret_back
layout: field
duration_s: 5.5
actions:
  - action: robot
    at_s: 0
    name: robodojo_23205
    ball_path: guided   # the guided launch (hood, turret, spring nip); physical: robodojo_physical_*
    position: [-1.3, 0.0, 1.05]
    yaw_deg: -90
    drive:
      - {at_s: 0.1, power: {intake: 1, transfer: 0.3}, servo: {gate: 0.5, hood: 0.5, flower_bar: 0.25}}
      - {at_s: 0.8, power: {intake: 0, transfer: 0, turret: 1}, velocity: {shooter: 1800}}
      - {at_s: 1.8, power: {turret: 0}}
      - {at_s: 2.5, servo: {gate: 0.8}, power: {transfer: 1}}
  - {action: spawn, at_s: 0.05, group: pollen, count: 1, relative_to: robot, center: [0.0, 0.0376, -0.25]}
trace: {group: pollen, index: -1, every_s: 0.1}
checks:
  - {check: element_peak_height, group: pollen, index: -1, min_m: 1.6}
  - {check: element_peak_max, group: pollen, index: -1, max_m: 2.1}
  - {check: element_in_robot, group: pollen, index: -1, min: [-0.8, -1.0, 0.3], max: [0.8, 3.0, 4.0]}
  - {check: robot_upright, max_tilt_deg: 3.0}
