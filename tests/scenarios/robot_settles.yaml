# Phase 5: the goBILDA StarterBot rests on its four raycast wheel contacts at the CAD ride height (origin on the
# tile surface, ~1 mm suspension sag; y is measured from the tile top under the robot, physics.yaml wheel_suspension_sag) without drifting or tipping.
name: robot_settles
layout: field
duration_s: 2.0
actions:
  - {action: robot, at_s: 0, name: gobilda_starter, position: [-1.3, 0.0, 1.05], yaw_deg: -90}
checks:
  - {check: robot_position, min: [-1.31, -0.004, 1.04], max: [-1.29, 0.002, 1.06]}
  - {check: robot_upright, max_tilt_deg: 1.0}
  - {check: robot_at_rest, linear_mps: 0.01}
