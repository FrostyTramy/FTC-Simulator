# Every robot part is solid to game elements (USER 2026-10-26), the drive wheels too: strafing left into a POLLEN beside
# the front-left mecanum wheel pushes it away; it never ends up inside the wheel (outer face at x -0.226 m).
name: robot_wheel_pushes_ball
layout: field
duration_s: 2.0
actions:
  - {action: robot, at_s: 0, name: gobilda_starter, position: [-1.3, 0.0, 1.05], yaw_deg: -90,
     drive: [{at_s: 0.3, strafe: -0.5}, {at_s: 1.3, strafe: 0}]}
  - {action: spawn, at_s: 0.05, group: pollen, count: 1, relative_to: robot, center: [-0.27, 0.0356, -0.132]}
trace: {group: pollen, index: -1, every_s: 0.2}
checks:
  - {check: element_displaced, group: pollen, index: -1, min_m: 0.1}
  - {check: element_in_robot, group: pollen, index: -1, min: [-3.0, 0.0, -1.0], max: [-0.255, 0.2, 1.0]}
  - {check: robot_upright, max_tilt_deg: 3.0}
