# RoboDojo #23205 flower bar is solid (USER 2026-10-26): swung down onto a NECTAR lying in front of the intake it pushes
# the element instead of passing through it. (Before D-037 the bar's layer was not scanned by elements.)
name: robodojo_flower_bar_pushes
layout: field
duration_s: 2.0
actions:
  - action: robot
    at_s: 0
    name: robodojo_23205
    position: [-1.3, 0.0, 1.05]
    yaw_deg: -90
    drive:
      - {at_s: 0.6, servo: {flower_bar: 1.0, hood: 0.0}}
  - {action: spawn, at_s: 0.05, group: nectar_red, count: 1, relative_to: robot, center: [0.05, 0.0467, -0.33]}
trace: {group: nectar_red, index: -1, every_s: 0.2}
checks:
  - {check: element_displaced, group: nectar_red, index: -1, min_m: 0.03}
  - {check: robot_upright, max_tilt_deg: 3.0}
