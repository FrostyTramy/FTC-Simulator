# Phase 5 direct drive on the real field: full forward for 1 s from rest, then BRAKE, facing blue (+X) on the
# audience-side lane (clear of the hive structure). Flat-floor reference (sim/Sim.Robots PlanarRobotSim, same
# powertrain): 1.849 m forward, 0.020 m to the robot's right (+Z here), yaw +1.0° at t = 2.0 s. The Godot robot gets
# its wheel loads from the raycast suspension instead of the static split, so a few cm of difference are expected.
name: robot_drives_forward
layout: field
duration_s: 2.25
actions:
  - {action: robot, at_s: 0, name: gobilda_starter, position: [-1.3, 0.0, 1.05], yaw_deg: -90,
     drive: [{at_s: 0.25, forward: 1}, {at_s: 1.25, forward: 0}]}
checks:
  - {check: robot_position, min: [0.47, -0.01, 1.02], max: [0.63, 0.01, 1.12]}
  - {check: robot_upright, max_tilt_deg: 2.0}
  - {check: robot_yaw, min_deg: -92, max_deg: -86}
  - {check: robot_at_rest, linear_mps: 0.02}
