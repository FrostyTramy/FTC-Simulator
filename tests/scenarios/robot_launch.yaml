# Phase 5 mechanisms: a POLLEN in front of the running intake is taken into the hopper, the launcher spins up to
# 1250 ticks/s (example code), then the windmill feeds it to the Hogback flywheel, which launches it up and back at
# half its rim speed (D-027). The ball must fly well above the robot; the flywheel's speed drops per shot.
name: robot_launch
layout: field
duration_s: 4.0
actions:
  - {action: robot, at_s: 0, name: gobilda_starter, position: [-1.3, 0.0, 1.05], yaw_deg: -90,
     drive: [{at_s: 0.1, intake: 1}, {at_s: 0.6, intake: 0, launcher: 1250}, {at_s: 1.8, windmill: 1}]}
  - {action: spawn, at_s: 0.05, group: pollen, count: 1, relative_to: robot, center: [0.0, 0.0376, -0.16]}
trace: {group: pollen, index: -1, every_s: 0.05}
checks:
  - {check: element_peak_height, group: pollen, index: -1, min_m: 0.6}
  - {check: robot_upright, max_tilt_deg: 3.0}
