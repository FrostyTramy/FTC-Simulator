# Phase 4: POLLEN dropped one pair at a time into the red HIVE's upper (audience) CELL. The hive is a real pivot with
# masses and dampers (D-011): enough elements in the upper cell must tip it to its other stable state (+60°, rear cell
# up, config/field_mechanisms.yaml hive_red_pivot). The number needed is not in the manual; this scenario reports it.
