// Reimplementation of the FTC SDK 12.0 public API on top of the simulator (spec 06).
plugins {
    id 'java-library'
}

version = '12.0.0-sim'

java {
    withSourcesJar()
}

// OpenCV Java bindings (scripts/setup_tools.ps1): part of the API team code compiles against, like the SDK's.
def opencvDir = "${rootDir}/../generated/tools/opencv"
dependencies {
    api files("${opencvDir}/opencv-4.9.0-0.jar")
}

tasks.named('test') {
    systemProperty 'ftcsim.opencv.dll', "${opencvDir}/opencv_java490.dll"
}

jar {
    archiveBaseName = 'ftc-sdk-shim'
    manifest {
        attributes('Implementation-Title': 'FTC SDK shim (simulator)', 'Implementation-Version': project.version)
    }
}
